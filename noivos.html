<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Noivos • Thaís & Cássio</title>
<style>
:root{--bg:#f7f2e9;--paper:#fffdf9;--ink:#2f2924;--muted:#736a61;--gold:#b48a50;--gold2:#8b6738;--line:#e8dfd2;--shadow:0 18px 50px rgba(64,45,28,.12)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{width:min(1080px,calc(100% - 28px));margin:auto;padding:34px 0 72px}.brand{font:700 27px Georgia,serif}.brand span{color:var(--gold);font-size:.72em}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:var(--gold);font-weight:800}h1{font:400 clamp(36px,6vw,58px)/1 Georgia,serif;margin:7px 0 10px}.sub{color:var(--muted);font-size:13px;line-height:1.6}.top{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:25px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--gold);background:transparent;color:var(--gold2);border-radius:999px;padding:10px 15px;font-weight:800;font-size:10px;letter-spacing:.07em;text-transform:uppercase;cursor:pointer}.btn.primary{background:var(--gold);color:#fff}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 25px rgba(64,45,28,.05)}.meta{font-size:10px;color:var(--muted);line-height:1.55}.name{font:600 23px Georgia,serif;margin:8px 0 4px}.gift{font-size:11px;color:var(--gold2);font-weight:800}.message{font:italic 18px/1.45 Georgia,serif;margin:16px 0 0;white-space:pre-wrap}.card-foot{display:flex;justify-content:flex-end;margin-top:16px}.danger{border-color:#caa8a0;color:#8c4e42}.empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--muted)}.login-shell{min-height:100vh;display:grid;place-items:center;padding:24px}.login{width:min(430px,100%);background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--shadow)}.login h1{font-size:42px}.field{display:grid;gap:6px;margin-top:14px}.field label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.field input{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px 14px;outline:none}.field input:focus{border-color:var(--gold)}.status{min-height:20px;color:#9b5144;font-size:12px;margin-top:10px}.hidden{display:none!important}.secure-note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:14px}.back{display:inline-block;margin-top:20px;color:var(--gold2);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}@media(max-width:760px){.grid{grid-template-columns:1fr}.top{align-items:start;flex-direction:column}.wrap{padding-top:24px}}
</style></head>
<body>
<section id="loginView" class="login-shell"><form id="loginForm" class="login"><div class="brand">T<span>&</span>C</div><div class="eyebrow" style="margin-top:22px">Área dos noivos</div><h1>Entrar</h1><div class="sub">Acesso reservado aos noivos para visualizar os cartões deixados junto aos presentes.</div><div class="field"><label for="user">Usuário</label><input id="user" autocomplete="username" required></div><div class="field"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn primary" style="width:100%;margin-top:18px" type="submit">Entrar</button><div id="loginStatus" class="status"></div><a class="back" href="index.html">← Voltar ao site</a></form></section>
<main id="dashboard" class="wrap hidden"><div class="top"><div><div class="brand">T<span>&</span>C</div><div class="eyebrow" style="margin-top:18px">Área dos noivos</div><h1>Cartões dos presentes</h1><div class="sub">Mensagens enviadas pelos convidados no momento do PIX.</div></div><div class="actions"><button class="btn" onclick="loadCards()">Atualizar</button><button class="btn" onclick="exportCards()">Exportar JSON</button><button class="btn danger" onclick="logout()">Sair</button></div></div><div id="cards" class="grid"></div></main>
<script>
const API={session:'api/session.php',login:'api/login.php',logout:'api/logout.php',messages:'api/mensagens.php'};
const brl=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n)||0);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opts={}){const r=await fetch(url,{credentials:'same-origin',...opts});let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.error||'Erro de conexão.');return j}
function showLogin(){document.getElementById('loginView').classList.remove('hidden');document.getElementById('dashboard').classList.add('hidden')}function showDashboard(){document.getElementById('loginView').classList.add('hidden');document.getElementById('dashboard').classList.remove('hidden');loadCards()}
async function check(){try{const s=await api(API.session);s.loggedIn?showDashboard():showLogin()}catch(e){showLogin();document.getElementById('loginStatus').textContent='O servidor da área dos noivos ainda não está ativo nesta hospedagem.'}}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const st=document.getElementById('loginStatus');st.textContent='Entrando…';try{await api(API.login,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:document.getElementById('user').value.trim(),password:document.getElementById('password').value})});st.textContent='';showDashboard()}catch(err){st.textContent=err.message}});
async function loadCards(){const box=document.getElementById('cards');box.innerHTML='<div class="empty">Carregando cartões…</div>';try{const r=await api(API.messages);const list=r.messages||[];if(!list.length){box.innerHTML='<div class="empty">Nenhum cartão recebido ainda.</div>';return}box.innerHTML=list.map(c=>`<article class="card"><div class="eyebrow">${new Date(c.createdAt).toLocaleString('pt-BR')}</div><div class="name">${esc(c.name||'Convidado')}</div><div class="gift">${esc(c.giftName)} • ${brl(c.amount)}</div><div class="meta">Pagamento: ${esc(c.paymentStatus||'não verificado')}</div>${c.message?`<div class="message">“${esc(c.message)}”</div>`:''}<div class="card-foot"><button class="btn danger" onclick="removeCard('${esc(c.id)}')">Excluir</button></div></article>`).join('')}catch(e){if(/autorizado/i.test(e.message)){showLogin();return}box.innerHTML='<div class="empty">Não foi possível carregar os cartões.</div>'}}
async function removeCard(id){if(!confirm('Excluir este cartão?'))return;await api(API.messages,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});loadCards()}
async function exportCards(){const r=await api(API.messages);const blob=new Blob([JSON.stringify(r.messages||[],null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cartoes-thais-cassio.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function logout(){try{await api(API.logout,{method:'POST'})}catch(e){}showLogin()}check();
</script></body></html>
