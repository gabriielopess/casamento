<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Noivos • Thaís & Cássio</title>
<style>
:root{--bg:#f7f2e9;--paper:#fffdf9;--ink:#2f2924;--muted:#736a61;--gold:#b48a50;--gold2:#8b6738;--line:#e8dfd2;--shadow:0 18px 50px rgba(64,45,28,.12)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{width:min(1080px,calc(100% - 28px));margin:auto;padding:34px 0 72px}.brand{font:700 27px Georgia,serif}.brand span{color:var(--gold);font-size:.72em}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:var(--gold);font-weight:800}h1{font:400 clamp(36px,6vw,58px)/1 Georgia,serif;margin:7px 0 10px}.sub{color:var(--muted);font-size:13px;line-height:1.6}.top{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:25px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--gold);background:transparent;color:var(--gold2);border-radius:999px;padding:10px 15px;font-weight:800;font-size:10px;letter-spacing:.07em;text-transform:uppercase;cursor:pointer}.btn.primary{background:var(--gold);color:#fff}.btn:disabled{opacity:.55;cursor:wait}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 25px rgba(64,45,28,.05)}.meta{font-size:10px;color:var(--muted);line-height:1.55}.name{font:600 23px Georgia,serif;margin:8px 0 4px}.gift{font-size:11px;color:var(--gold2);font-weight:800}.message{font:italic 18px/1.45 Georgia,serif;margin:16px 0 0;white-space:pre-wrap}.card-foot{display:flex;justify-content:flex-end;margin-top:16px}.danger{border-color:#caa8a0;color:#8c4e42}.empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--muted)}.login-shell{min-height:100vh;display:grid;place-items:center;padding:24px}.login{width:min(430px,100%);background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--shadow)}.login h1{font-size:42px}.field{display:grid;gap:6px;margin-top:14px}.field label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.field input{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px 14px;outline:none}.field input:focus{border-color:var(--gold)}.status{min-height:20px;color:#9b5144;font-size:12px;margin-top:10px;line-height:1.45}.status.ok{color:#52724e}.hidden{display:none!important}.back{display:inline-block;margin-top:20px;color:var(--gold2);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;text-decoration:none}@media(max-width:760px){.grid{grid-template-columns:1fr}.top{align-items:start;flex-direction:column}.wrap{padding-top:24px}}
</style>
</head>
<body>
<section id="loginView" class="login-shell">
  <form id="loginForm" class="login" novalidate>
    <div class="brand">T<span>&</span>C</div>
    <div class="eyebrow" style="margin-top:22px">Área dos noivos</div>
    <h1>Entrar</h1>
    <div class="sub">Acesso reservado aos noivos para visualizar os cartões deixados junto aos presentes.</div>
    <div class="field"><label for="user">Usuário</label><input id="user" autocomplete="username" required></div>
    <div class="field"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required></div>
    <button id="loginBtn" class="btn primary" style="width:100%;margin-top:18px" type="submit">Entrar</button>
    <div id="loginStatus" class="status"></div>
    <a class="back" href="index.html">← Voltar ao site</a>
  </form>
</section>
<main id="dashboard" class="wrap hidden">
  <div class="top">
    <div><div class="brand">T<span>&</span>C</div><div class="eyebrow" style="margin-top:18px">Área dos noivos</div><h1>Cartões dos presentes</h1><div class="sub">Mensagens enviadas pelos convidados no momento do PIX.</div></div>
    <div class="actions"><button class="btn" id="refreshBtn">Atualizar</button><button class="btn" id="exportBtn">Exportar JSON</button><button class="btn danger" id="logoutBtn">Sair</button></div>
  </div>
  <div id="cards" class="grid"></div>
</main>
<script>
const SUPABASE_URL='https://faunfjguuupgwoleyuye.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_mWJK65OzhMn72ESsOwrbYA_F-TqovBO';
const NOIVOS_USERNAME='thaisecassio';
const NOIVOS_EMAIL='noivos@thaisecassio.com.br';
const SESSION_KEY='tc_noivos_supabase_session_v2';

const brl=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n)||0);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const loginView=document.getElementById('loginView');
const dashboard=document.getElementById('dashboard');
const loginStatus=document.getElementById('loginStatus');
const loginBtn=document.getElementById('loginBtn');

function showLogin(msg=''){
  loginView.classList.remove('hidden');
  dashboard.classList.add('hidden');
  if(msg) loginStatus.textContent=msg;
}
function showDashboard(){
  loginView.classList.add('hidden');
  dashboard.classList.remove('hidden');
  loginStatus.textContent='';
  loadCards();
}
function readSession(){
  try{return JSON.parse(localStorage.getItem(SESSION_KEY)||'null')}catch{return null}
}
function writeSession(s){localStorage.setItem(SESSION_KEY,JSON.stringify(s))}
function clearSession(){localStorage.removeItem(SESSION_KEY)}
function sessionFromAuth(data){
  return {
    access_token:data.access_token,
    refresh_token:data.refresh_token,
    expires_at:Date.now()+Math.max(30,(Number(data.expires_in)||3600))*1000,
    user:data.user||null
  };
}
async function parseResponse(res){
  const text=await res.text();
  if(!text)return {};
  try{return JSON.parse(text)}catch{return {message:text}}
}
async function supabaseFetch(path,{method='GET',body=null,token=null,headers={}}={}){
  const h={apikey:SUPABASE_PUBLISHABLE_KEY,...headers};
  if(body!==null)h['Content-Type']='application/json';
  if(token)h.Authorization='Bearer '+token;
  return fetch(SUPABASE_URL+path,{method,headers:h,body:body===null?undefined:JSON.stringify(body),cache:'no-store'});
}
async function refreshSession(session){
  if(!session?.refresh_token)return null;
  try{
    const res=await supabaseFetch('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:session.refresh_token}});
    const data=await parseResponse(res);
    if(!res.ok||!data.access_token){clearSession();return null}
    const next=sessionFromAuth(data);writeSession(next);return next;
  }catch{clearSession();return null}
}
async function validSession(){
  let s=readSession();
  if(!s?.access_token)return null;
  if((s.expires_at||0) < Date.now()+60000)s=await refreshSession(s);
  if(!s)return null;
  try{
    const res=await supabaseFetch('/auth/v1/user',{token:s.access_token});
    if(res.ok)return s;
    if(res.status===401)return await refreshSession(s);
    return null;
  }catch{return null}
}
function authErrorMessage(data,status){
  const raw=String(data?.msg||data?.message||data?.error_description||data?.error||'').trim();
  if(/invalid login credentials/i.test(raw))return 'Usuário ou senha incorretos no Supabase.';
  if(/email not confirmed/i.test(raw))return 'O e-mail dos noivos ainda não está confirmado no Supabase.';
  if(/rate limit/i.test(raw))return 'Muitas tentativas. Aguarde alguns instantes e tente novamente.';
  return raw ? `Falha do Supabase: ${raw}` : `Não foi possível entrar (erro ${status}).`;
}

document.getElementById('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const user=document.getElementById('user').value.trim().toLowerCase();
  const password=document.getElementById('password').value;
  loginStatus.classList.remove('ok');
  if(user!==NOIVOS_USERNAME){loginStatus.textContent='Usuário ou senha incorretos.';return}
  if(!password){loginStatus.textContent='Digite a senha.';return}
  loginBtn.disabled=true;loginBtn.textContent='Entrando…';loginStatus.textContent='Conectando ao Supabase…';
  try{
    const res=await supabaseFetch('/auth/v1/token?grant_type=password',{method:'POST',body:{email:NOIVOS_EMAIL,password}});
    const data=await parseResponse(res);
    if(!res.ok||!data.access_token){
      loginStatus.textContent=authErrorMessage(data,res.status);
      return;
    }
    const session=sessionFromAuth(data);
    writeSession(session);
    loginStatus.classList.add('ok');loginStatus.textContent='Login realizado.';
    showDashboard();
  }catch(err){
    loginStatus.textContent='Não foi possível conectar ao Supabase. Verifique sua internet e tente novamente.';
  }finally{
    loginBtn.disabled=false;loginBtn.textContent='Entrar';
  }
});

async function apiForCards(path,{method='GET',body=null,headers={}}={}){
  let s=await validSession();
  if(!s){showLogin('Sua sessão expirou. Entre novamente.');throw new Error('session')}
  let res=await supabaseFetch(path,{method,body,token:s.access_token,headers});
  if(res.status===401){
    s=await refreshSession(s);
    if(!s){showLogin('Sua sessão expirou. Entre novamente.');throw new Error('session')}
    res=await supabaseFetch(path,{method,body,token:s.access_token,headers});
  }
  return res;
}
async function loadCards(){
  const box=document.getElementById('cards');
  box.innerHTML='<div class="empty">Carregando cartões…</div>';
  try{
    const res=await apiForCards('/rest/v1/cartoes?select=id,created_at,name,message,gift_name,amount,payment_status&order=created_at.desc');
    const data=await parseResponse(res);
    if(!res.ok){box.innerHTML='<div class="empty">Não foi possível carregar os cartões. '+esc(data?.message||data?.details||('Erro '+res.status))+'</div>';return}
    const list=Array.isArray(data)?data:[];
    if(!list.length){box.innerHTML='<div class="empty">Nenhum cartão recebido ainda.</div>';return}
    box.innerHTML=list.map(c=>`<article class="card"><div class="eyebrow">${new Date(c.created_at).toLocaleString('pt-BR')}</div><div class="name">${esc(c.name||'Convidado')}</div><div class="gift">${esc(c.gift_name)} • ${brl(c.amount)}</div><div class="meta">Pagamento: ${c.payment_status==='nao_verificado'?'não verificado':esc(c.payment_status)}</div>${c.message?`<div class="message">“${esc(c.message)}”</div>`:''}<div class="card-foot"><button class="btn danger" data-delete="${esc(c.id)}">Excluir</button></div></article>`).join('');
    box.querySelectorAll('[data-delete]').forEach(btn=>btn.addEventListener('click',()=>removeCard(btn.dataset.delete)));
  }catch(err){if(err.message!=='session')box.innerHTML='<div class="empty">Falha de conexão ao carregar os cartões.</div>'}
}
async function removeCard(id){
  if(!confirm('Excluir este cartão?'))return;
  try{
    const res=await apiForCards('/rest/v1/cartoes?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:{Prefer:'return=minimal'}});
    if(!res.ok){const d=await parseResponse(res);alert('Não foi possível excluir: '+(d?.message||res.status));return}
    loadCards();
  }catch{}
}
async function exportCards(){
  try{
    const res=await apiForCards('/rest/v1/cartoes?select=*&order=created_at.desc');
    const data=await parseResponse(res);
    if(!res.ok){alert('Não foi possível exportar.');return}
    const blob=new Blob([JSON.stringify(data||[],null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cartoes-thais-cassio.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }catch{}
}
async function logout(){
  const s=readSession();
  try{if(s?.access_token)await supabaseFetch('/auth/v1/logout',{method:'POST',token:s.access_token})}catch{}
  clearSession();showLogin();
}

document.getElementById('refreshBtn').addEventListener('click',loadCards);
document.getElementById('exportBtn').addEventListener('click',exportCards);
document.getElementById('logoutBtn').addEventListener('click',logout);
(async()=>{const s=await validSession();s?showDashboard():showLogin()})();
</script>
</body>
</html>
