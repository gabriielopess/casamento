<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Noivos • Thaís & Cássio</title>
<style>
:root{--bg:#f7f2e9;--paper:#fffdf9;--ink:#2f2924;--muted:#736a61;--gold:#b48a50;--gold2:#8b6738;--line:#e8dfd2;--shadow:0 18px 50px rgba(64,45,28,.12)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{width:min(1080px,calc(100% - 28px));margin:auto;padding:34px 0 72px}.brand{font:700 27px Georgia,serif}.brand span{color:var(--gold);font-size:.72em}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:var(--gold);font-weight:800}h1{font:400 clamp(36px,6vw,58px)/1 Georgia,serif;margin:7px 0 10px}.sub{color:var(--muted);font-size:13px;line-height:1.6}.top{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:25px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--gold);background:transparent;color:var(--gold2);border-radius:999px;padding:10px 15px;font-weight:800;font-size:10px;letter-spacing:.07em;text-transform:uppercase;cursor:pointer}.btn.primary{background:var(--gold);color:#fff}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 25px rgba(64,45,28,.05)}.meta{font-size:10px;color:var(--muted);line-height:1.55}.name{font:600 23px Georgia,serif;margin:8px 0 4px}.gift{font-size:11px;color:var(--gold2);font-weight:800}.message{font:italic 18px/1.45 Georgia,serif;margin:16px 0 0;white-space:pre-wrap}.card-foot{display:flex;justify-content:flex-end;margin-top:16px}.danger{border-color:#caa8a0;color:#8c4e42}.empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--muted)}.login-shell{min-height:100vh;display:grid;place-items:center;padding:24px}.login{width:min(430px,100%);background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--shadow)}.login h1{font-size:42px}.field{display:grid;gap:6px;margin-top:14px}.field label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.field input{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px 14px;outline:none}.field input:focus{border-color:var(--gold)}.status{min-height:20px;color:#9b5144;font-size:12px;margin-top:10px;line-height:1.45}.hidden{display:none!important}.back{display:inline-block;margin-top:20px;color:var(--gold2);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;text-decoration:none}@media(max-width:760px){.grid{grid-template-columns:1fr}.top{align-items:start;flex-direction:column}.wrap{padding-top:24px}}
</style>
</head>
<body>
<section id="loginView" class="login-shell">
  <form id="loginForm" class="login">
    <div class="brand">T<span>&</span>C</div>
    <div class="eyebrow" style="margin-top:22px">Área dos noivos</div>
    <h1>Entrar</h1>
    <div class="sub">Acesso reservado aos noivos para visualizar os cartões deixados junto aos presentes.</div>
    <div class="field"><label for="user">Usuário</label><input id="user" autocomplete="username" required></div>
    <div class="field"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required></div>
    <button class="btn primary" style="width:100%;margin-top:18px" type="submit">Entrar</button>
    <div id="loginStatus" class="status"></div>
    <a class="back" href="index.html">← Voltar ao site</a>
  </form>
</section>
<main id="dashboard" class="wrap hidden">
  <div class="top">
    <div><div class="brand">T<span>&</span>C</div><div class="eyebrow" style="margin-top:18px">Área dos noivos</div><h1>Cartões dos presentes</h1><div class="sub">Mensagens enviadas pelos convidados no momento do PIX.</div></div>
    <div class="actions"><button class="btn" id="refreshBtn">Atualizar</button><button class="btn" id="exportBtn">Exportar JSON</button><button class="btn danger" id="logoutBtn">Sair</button></div>
  </div>
  <div id="cards" class="grid"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://faunfjguuupgwoleyuye.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_mWJK65OzhMn72ESsOwrbYA_F-TqovBO';
const NOIVOS_USERNAME='thaisecassio';
const NOIVOS_EMAIL='noivos@thaisecassio.com.br';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const brl=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n)||0);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function showLogin(){document.getElementById('loginView').classList.remove('hidden');document.getElementById('dashboard').classList.add('hidden')}
function showDashboard(){document.getElementById('loginView').classList.add('hidden');document.getElementById('dashboard').classList.remove('hidden');loadCards()}
async function check(){const {data}=await db.auth.getSession();data.session?showDashboard():showLogin()}
document.getElementById('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const st=document.getElementById('loginStatus');
  const user=document.getElementById('user').value.trim().toLowerCase();
  const password=document.getElementById('password').value;
  if(user!==NOIVOS_USERNAME){st.textContent='Usuário ou senha incorretos.';return}
  st.textContent='Entrando…';
  const {error}=await db.auth.signInWithPassword({email:NOIVOS_EMAIL,password});
  if(error){st.textContent='Usuário ou senha incorretos.';return}
  st.textContent='';showDashboard();
});
async function loadCards(){
  const box=document.getElementById('cards');
  box.innerHTML='<div class="empty">Carregando cartões…</div>';
  const {data,error}=await db.from('cartoes').select('id,created_at,name,message,gift_name,amount,payment_status').order('created_at',{ascending:false});
  if(error){box.innerHTML='<div class="empty">Não foi possível carregar os cartões. Verifique a configuração do Supabase.</div>';return}
  const list=data||[];
  if(!list.length){box.innerHTML='<div class="empty">Nenhum cartão recebido ainda.</div>';return}
  box.innerHTML=list.map(c=>`<article class="card"><div class="eyebrow">${new Date(c.created_at).toLocaleString('pt-BR')}</div><div class="name">${esc(c.name||'Convidado')}</div><div class="gift">${esc(c.gift_name)} • ${brl(c.amount)}</div><div class="meta">Pagamento: ${c.payment_status==='nao_verificado'?'não verificado':esc(c.payment_status)}</div>${c.message?`<div class="message">“${esc(c.message)}”</div>`:''}<div class="card-foot"><button class="btn danger" data-delete="${esc(c.id)}">Excluir</button></div></article>`).join('');
  box.querySelectorAll('[data-delete]').forEach(btn=>btn.addEventListener('click',()=>removeCard(btn.dataset.delete)));
}
async function removeCard(id){if(!confirm('Excluir este cartão?'))return;const {error}=await db.from('cartoes').delete().eq('id',id);if(error){alert('Não foi possível excluir o cartão.');return}loadCards()}
async function exportCards(){const {data,error}=await db.from('cartoes').select('*').order('created_at',{ascending:false});if(error){alert('Não foi possível exportar.');return}const blob=new Blob([JSON.stringify(data||[],null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cartoes-thais-cassio.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function logout(){await db.auth.signOut();showLogin()}
document.getElementById('refreshBtn').addEventListener('click',loadCards);
document.getElementById('exportBtn').addEventListener('click',exportCards);
document.getElementById('logoutBtn').addEventListener('click',logout);
db.auth.onAuthStateChange((_event,session)=>{if(!session)showLogin()});
check();
</script>
</body>
</html>
